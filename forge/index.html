    <!--
    Static splash screen styles.
    These are inline so they apply before any JS or external CSS loads,
    preventing any white flash or blank frame at startup.
    CSS variables (defined in the Angular bundle, which is render-blocking)
    resolve correctly on first paint; hex fallbacks cover the rare edge case.
  -->
    <style>
      body {
        background: #08090a; /* Dark (default) — prevents white flash */
      }

      #forge-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--forge-color-background, #08090a);
      }

      .forge-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .forge-splash__symbol {
        display: block;
        width: 44px;
        height: 44px;
        color: var(--forge-color-text, #f2f4f5);
      }

      .forge-splash__wordmark {
        display: block;
        height: 28px;
        width: auto;
        color: var(--forge-color-text, #f2f4f5);
      }

      .forge-splash__tagline {
        margin: 0;
        font-size: 0.75rem;
        font-family: var(--forge-font-family, system-ui, sans-serif);
        font-weight: 400;
        color: var(--forge-color-text-secondary, #8a909a);
        letter-spacing: 0.02em;
        text-align: center;
      }
    </style>

    <!--
    Apply the stored theme class synchronously before first paint so the
    correct theme background and text colors are in place from frame one.
    ThemeService writes 'forge_theme_hint' to localStorage on every theme change.
  -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("forge_theme_hint");
          if (t === "light") document.body.classList.add("theme-light");
        } catch (e) {}
      })();
    </script>
